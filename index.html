<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>KirSon</title>
  <meta name="description" content="KirSon — естественная ретушь селфи прямо на телефоне. Фото не покидают устройство.">
  <meta name="theme-color" content="#F6F2ED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1512" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KirSon">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="bar glass">
    <div class="brand"><picture><source srcset="icons/monogram-dark.svg" media="(prefers-color-scheme: dark)"><img src="icons/monogram.svg" alt="" class="mono"></picture><span class="word">KirSon</span></div>
    <div class="actions">
      <button id="btn-open" class="icon" aria-label="Открыть фото" title="Открыть фото">
        <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3l1.5 2h8.5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button id="btn-undo" class="icon" aria-label="Отменить" title="Отменить" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-2"/></svg>
      </button>
      <button id="btn-redo" class="icon" aria-label="Повторить" title="Повторить" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 7 4.5 4.5L15 16"/><path d="M19 11.5h-9a5 5 0 0 0 0 10h2"/></svg>
      </button>
      <button id="btn-help" class="icon" aria-label="Подсказки" title="Подсказки">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><path d="M12 16.6v.2"/></svg>
      </button>
      <button id="btn-save" class="primary" disabled>Сохранить</button>
    </div>
  </header>

  <main id="stage">
    <div id="welcome" class="welcome glass">
      <picture><source srcset="icons/monogram-dark.svg" media="(prefers-color-scheme: dark)"><img src="icons/monogram.svg" alt="" class="mono-big"></picture>
      <h1>KirSon</h1>
      <p>Естественная ретушь селфи. Фото обрабатываются на телефоне и никуда не отправляются.</p>
      <button id="btn-open-big" class="primary big">Открыть фото</button>
      <div id="version" class="version"></div>
    </div>
    <div id="frame-box">
      <canvas id="view" hidden></canvas>
      <canvas id="overlay" hidden></canvas>
      <canvas id="before-view" hidden></canvas>
      <div id="split-line" hidden><span class="split-handle"></span><b class="split-tag l">до</b><b class="split-tag r">после</b></div>
      <div id="frame" hidden><i class="h lt"></i><i class="h rt"></i><i class="h lb"></i><i class="h rb"></i></div>
    </div>
    <button id="btn-before" class="chip-btn glass" hidden>До</button>
    <button id="btn-split" class="chip-btn split glass" hidden aria-label="Шторка до/после">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M12 3.5v17"/></svg>
    </button>
    <button id="btn-fit" class="chip-btn fit glass" hidden>Вписать</button>
    <div id="ring" class="ring" hidden></div>
    <div id="busy" class="busy" hidden><span></span></div>
    <div id="toast" class="toast" hidden></div>
  </main>

  <footer id="panel" class="panel glass" hidden>
    <div class="slider-row" id="slider-row">
      <span id="tool-label" class="tool-label"></span>
      <input id="slider" type="range" min="-100" max="100" value="0" step="1">
      <button id="tool-value" class="tool-value" title="Сбросить">0</button>
    </div>
    <div class="panel-hint" id="panel-hint" hidden></div>
    <div class="tools" id="tools"></div>
    <nav class="tabs" id="tabs"></nav>
  </footer>

  <input id="file" type="file" accept="image/*" hidden>
  <input id="bg-file" type="file" accept="image/*" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
